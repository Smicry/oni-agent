<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>ONI 慢系统控制台</title>
<style>
body{font-family:-apple-system,sans-serif;background:#1a1d24;color:#d8dee9;margin:0;padding:16px;font-size:13px}
h1{font-size:18px;color:#88c0d0;margin:0 0 12px}
h2{font-size:14px;color:#81a1c1;border-bottom:1px solid #3b4252;padding-bottom:4px;margin:0 0 8px}
.card{background:#2e3440;border-radius:6px;padding:10px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.kv{background:#3b4252;padding:8px;border-radius:4px}.kv b{color:#88c0d0}
.dupe{padding:4px 0;border-bottom:1px solid #3b4252}
input,button{font-size:13px;padding:6px 10px;border-radius:4px;border:1px solid #4c566a;background:#3b4252;color:#d8dee9}
button{background:#5e81ac;cursor:pointer}button:hover{background:#81a1c1}
#cmd{flex:1;min-width:0}.small{color:#a3be8c;font-size:11px}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inputrow{display:flex;gap:6px;align-items:center}
/* 两栏：左主对话，右操作+态势 */
.layout{display:flex;gap:14px;align-items:stretch}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:calc(100vh - 72px)}
.side{width:320px;flex-shrink:0;overflow-y:auto}
@media(max-width:900px){.layout{flex-direction:column}.main{height:auto}.side{width:100%;overflow:visible}}
/* 对话流 */
#conv{flex:1;min-height:300px;overflow-y:auto;background:#2e3440;border-radius:6px;padding:10px;margin-bottom:8px}
.msg{margin:8px 0;padding:8px 10px;border-radius:6px;line-height:1.5}
.msg-user{background:#3b4252;border-left:3px solid #88c0d0}
.msg-ai{background:#434c5e;border-left:3px solid #a3be8c}
.msg-fast{background:#4c566a;border-left:3px solid #ebcb8b}
.msg-result{background:#3b4252;border-left:3px solid #b48ead}
.msg-circuit{background:#4c566a;border-left:3px solid #bf616a}
.msg .who{font-size:11px;color:#88c0d0;margin-bottom:3px}
.msg-ai .who{color:#a3be8c}
.msg-fast .who{color:#ebcb8b}
.msg-result .who{color:#b48ead}
.msg-circuit .who{color:#bf616a}
.msg .body{white-space:pre-wrap;word-break:break-word}
.msg .result{margin-top:5px;font-size:11px;color:#ebcb8b;border-top:1px dashed #4c566a;padding-top:4px}
.badge{font-size:10px;padding:1px 5px;border-radius:3px;margin-left:6px}
.badge.success{background:#a3be8c;color:#2e3440}
.badge.fail{background:#bf616a;color:#fff}
.badge.pending{background:#ebcb8b;color:#2e3440}
.panel-title{color:#81a1c1;font-weight:bold;margin-bottom:8px}
</style></head><body>
<h1>ONI 慢系统控制台 <span id="mode" class="small"></span></h1>
<div class="layout">
  <div class="main">
    <h2>对话（快系统卡点 ↔ 慢系统决策 ↔ 执行反馈 ↔ 用户指令）</h2>
    <div id="conv"></div>
    <div class="card inputrow">
      <input id="cmd" placeholder="输入指令后回车发送（世界暂停→慢系统处理→恢复自主）" onkeydown="if(event.key==='Enter')sendCmd()">
      <button onclick="sendCmd()">下发</button>
    </div>
  </div>
  <div class="side">
    <div class="card">
      <div class="panel-title">操作</div>
      <div class="ctrl" id="controls">
        <button id="aiToggle" onclick="toggleAI()" style="min-width:110px;font-weight:bold">⏸ 停止 AI</button>
      </div>
      <div class="small" id="worldState" style="margin-top:8px"></div>
      <div class="small" style="margin-top:6px">速度 <button onclick="ctl('speed',1)">1x</button> <button onclick="ctl('speed',2)">2x</button> <button onclick="ctl('speed',3)">3x</button></div>
    </div>
    <div class="card"><div class="grid" id="stats"></div></div>
    <h2>复制人</h2><div class="card" id="dupes" style="margin-top:0"></div>
  </div>
</div>
<script>
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function time(ts){if(!ts)return'';var d=new Date(ts*1000);return d.toLocaleTimeString();}
async function refresh(){
  var r=await fetch('/api/state'); if(!r.ok) return; var s=await r.json();
  document.getElementById('mode').textContent='['+s.mode+'] '+time(s.updated_at);
  document.getElementById('worldState').textContent=s.paused?'世界:已暂停':'世界:运行中';
  var tog=document.getElementById('aiToggle');
  if(s.ai_enabled===false){
    tog.textContent='▶ 启动 AI'; tog.style.background='#a3be8c'; tog.style.color='#2e3440';
  }else{
    tog.textContent='⏸ 停止 AI'; tog.style.background='#5e81ac'; tog.style.color='#d8dee9';
  }
  document.getElementById('stats').innerHTML=
    '<div class="kv"><b>周期</b><br>'+s.cycle+'</div>'+
    '<div class="kv"><b>世界</b><br>'+(s.paused?'暂停':'运行')+'</div>'+
    '<div class="kv"><b>食物</b><br>'+Math.round(s.food_kcal)+' kcal</div>'+
    '<div class="kv"><b>氧气</b><br>'+Math.round(s.oxygen_kg)+' kg</div>'+
    '<div class="kv"><b>可呼吸格</b><br>'+s.breathable_cells+'</div>';
  document.getElementById('dupes').innerHTML=(s.dupes||[]).map(function(d){
    return '<div class="dupe">'+esc(d.name)+' @('+d.x+','+d.y+') '+esc(d.chore)+' 膀胱'+Math.round(d.bladder)+' 呼吸'+Math.round(d.breath)+'</div>';}).join('')||'<div class="small">无数据</div>';
  var conv=document.getElementById('conv');
  // ★ 换局/读档检测：指纹或局内纪元变了 → 对话流从零开始，不把上一周期的对话挂着。
  //   后端在 clear_save_state 时归档旧指令；这里负责前端那一半。
  var ep=(s.save_fingerprint||'?')+'#'+(s.session_epoch||0);
  if(window.__oniEpoch && window.__oniEpoch!==ep){
    conv.innerHTML='<div class="small">🔁 换局/读档（'+esc(s.save_fingerprint||'')+'）→ 对话已重置</div>';
  }
  window.__oniEpoch=ep;
  var roleUi={'user':['你','msg-user'],'assistant':['慢系统','msg-ai'],'fast':['快系统·卡点','msg-fast'],'result':['快系统·反馈','msg-result'],'circuit':['熔断闸门','msg-circuit']};
  conv.innerHTML=(s.conversation||[]).map(function(m){
    var ui=roleUi[m.role]||roleUi['assistant'];
    var label=m.status_label||(m.status==='success'?'完成':m.status==='fail'?'失败':'待处理');
    var badge=m.status?'<span class="badge '+m.status+'">'+esc(label)+'</span>':'';
    var result=m.result?'<div class="result">→ '+esc(m.result)+'</div>':'';
    return '<div class="msg '+ui[1]+'">'+
      '<div class="who">'+ui[0]+' '+badge+' <span class="small">'+time(m.ts)+'</span></div>'+
      '<div class="body">'+esc(m.text)+'</div>'+result+'</div>';
  }).join('')||'<div class="small">暂无对话</div>';
  conv.scrollTop=conv.scrollHeight;
}
async function ctl(op,val){
  var body=op==='speed'?JSON.stringify({speed:val}):'';
  await fetch('/api/ctl/'+op,{method:'POST',body:body}); refresh();
}
async function toggleAI(){
  var tog=document.getElementById('aiToggle');
  var stopping=tog.textContent.indexOf('停止')>=0;
  await fetch('/api/ctl/'+(stopping?'stop':'start'),{method:'POST'});
  refresh();
}
async function sendCmd(){var el=document.getElementById('cmd');var t=el.value.trim();if(!t)return;
  await fetch('/api/command',{method:'POST',body:t});el.value='';refresh();}
refresh();setInterval(refresh,2000);
</script></body></html>
