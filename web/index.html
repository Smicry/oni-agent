<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>ONI 慢系统控制台</title>
<style>
body{font-family:-apple-system,sans-serif;background:#1a1d24;color:#d8dee9;margin:0;padding:16px;font-size:13px}
h1{font-size:18px;color:#88c0d0;margin:0 0 4px}h2{font-size:14px;color:#81a1c1;border-bottom:1px solid #3b4252;padding-bottom:4px;margin-top:16px}
.card{background:#2e3440;border-radius:6px;padding:10px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kv{background:#3b4252;padding:8px;border-radius:4px}.kv b{color:#88c0d0}
.dupe{padding:4px 0;border-bottom:1px solid #3b4252}
.esc{background:#3b4252;padding:8px;margin:6px 0;border-radius:4px;border-left:3px solid #ebcb8b}
.cand{background:#4c566a;padding:4px 8px;margin:4px 0;border-radius:3px;cursor:pointer;display:inline-block;margin-right:6px}
.cand:hover{background:#5e81ac}
input,button{font-size:13px;padding:6px 10px;border-radius:4px;border:1px solid #4c566a;background:#3b4252;color:#d8dee9}
button{background:#5e81ac;cursor:pointer}button:hover{background:#81a1c1}
button.danger{background:#bf616a}button.danger:hover{background:#d08770}
button.on{background:#a3be8c;color:#2e3440}
#cmd{width:60%}.small{color:#a3be8c;font-size:11px}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
</style></head><body>
<h1>ONI 慢系统控制台 <span id="mode" class="small"></span></h1>
<div class="card ctrl" id="controls">
  <button onclick="ctl('pause')" id="btnPause">暂停</button>
  <button onclick="ctl('resume')" id="btnResume">继续</button>
  <button onclick="ctl('speed',1)">1x</button>
  <button onclick="ctl('speed',2)">2x</button>
  <button onclick="ctl('speed',3)">3x</button>
  <button onclick="ctl('window')">开120s窗口</button>
  <span id="worldState" class="small"></span>
</div>
<div class="card"><div class="grid" id="stats"></div></div>
<h2>复制人</h2><div class="card" id="dupes"></div>
<h2>待决策卡点 <span class="small" id="esccount"></span></h2><div id="escs"></div>
<h2>用户指令（输入后世界暂停，慢系统处理后恢复自主）</h2>
<div class="card"><input id="cmd" placeholder="输入指令，如：优先采食物"><button onclick="sendCmd()">下发</button></div>
<div id="cmds"></div>
<h2>最近决策</h2><div class="card" id="decisions"></div>
<script>
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function refresh(){
  var r=await fetch('/api/state'); if(!r.ok) return; var s=await r.json();
  document.getElementById('mode').textContent='['+s.mode+'] '+new Date(s.updated_at*1000).toLocaleTimeString();
  document.getElementById('worldState').textContent=s.paused?'世界:已暂停':'世界:运行中';
  document.getElementById('stats').innerHTML=
    '<div class="kv"><b>周期</b><br>'+s.cycle+'</div>'+
    '<div class="kv"><b>世界</b><br>'+(s.paused?'暂停':'运行')+'</div>'+
    '<div class="kv"><b>食物</b><br>'+Math.round(s.food_kcal)+' kcal</div>'+
    '<div class="kv"><b>氧气</b><br>'+Math.round(s.oxygen_kg)+' kg</div>'+
    '<div class="kv"><b>可呼吸格</b><br>'+s.breathable_cells+'</div>';
  document.getElementById('dupes').innerHTML=(s.dupes||[]).map(function(d){
    return '<div class="dupe">'+esc(d.name)+' @('+d.x+','+d.y+') '+esc(d.chore)+' 膀胱'+Math.round(d.bladder)+' 呼吸'+Math.round(d.breath)+'</div>';}).join('')||'<div class="small">无数据</div>';
  document.getElementById('esccount').textContent=(s.escalations||[]).length+' 条';
  document.getElementById('escs').innerHTML=(s.escalations||[]).map(function(e){
    var c=e.context||{}; var cands=(c.candidates||[]).map(function(x){
      return '<span class="cand" onclick="decide('+e.id+','+JSON.stringify(x.id)+')">'+esc(x.id)+': '+esc(x.action)+'</span>';}).join('');
    return '<div class="esc">#'+e.id+' '+esc(e.detail)+'<div class="small">卡点='+esc(c.obstacle||'-')+'</div>'+cands+'</div>';}).join('')||'<div class="small">无待决策卡点</div>';
  document.getElementById('cmds').innerHTML=(s.commands||[]).map(function(c){
    return '<div class="small">#'+c.id+' '+esc(c.text)+'</div>';}).join('')||'<div class="small">无待处理指令</div>';
  document.getElementById('decisions').innerHTML='<div class="small">'+esc(s.last_decision)+'</div>'+
    (s.recent_decisions||[]).slice(0,5).map(function(d){
      return '<div class="small">['+esc(d.source||'慢系统')+'] '+esc(d.action||'')+': '+esc(d.reason||'')+'</div>';}).join('');
}
async function ctl(op,val){
  var body=op==='speed'?JSON.stringify({speed:val}):'';
  await fetch('/api/ctl/'+op,{method:'POST',body:body}); refresh();
}
async function sendCmd(){var t=document.getElementById('cmd').value;if(!t)return;
  await fetch('/api/command',{method:'POST',body:t});document.getElementById('cmd').value='';refresh();}
async function decide(id,choice){await fetch('/api/decide',{method:'POST',body:JSON.stringify({id:id,choice:choice})});refresh();}
refresh();setInterval(refresh,2000);
</script></body></html>
